<!DOCTYPE html>
<!-- app-today：这一页的整页布局（锁一屏、TabBar 贴底）挂在这个 class 上，
     不挂 data-slot —— 后者要等脚本算出饭点才写得上，在那之前 TabBar 会先落在
     错的位置再跳一下。data-slot 只管配色。 -->
<html lang="zh-CN" class="app-today">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 不要加 apple-mobile-web-app-status-bar-style=black-translucent：主屏 App 开了透明
     状态栏，页面顶边会延伸到状态栏后面，底边却不跟着往下，固定在底部的 TabBar
     被整体抬高约一个状态栏（2026-09-23 真机录屏实测约 50pt，和候选池页对不齐）。
     状态栏用普通样式，颜色由下面的 theme-color 给，ui-today.js 按饭点和深浅色改写。 -->
<meta name="theme-color" content="#3b2a52">
<title>今天这顿</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
<script>
// 页面切换的淡入淡出被打断时（比如还没播完又点了另一个标签），浏览器那条
// Promise 没人接，控制台会报一条 AbortError。接住它，不然真机上排查别的
// 问题时满屏都是这条。被跳过时拒绝的是 ready，不是 finished —— 两条都要接。
function hushTransition(e) {
  if (!e.viewTransition) return;
  e.viewTransition.ready.catch(function () {});
  e.viewTransition.finished.catch(function () {});
}
window.addEventListener('pagereveal', hushTransition);
window.addEventListener('pageswap', hushTransition);
</script>
</head>
<body>
<main class="wrap">
  <section id="card" class="board" hidden>
    <div class="stack">
      <!-- 垫在底下的真卡片：内容是下一道（往右拖时换成上一道），由 ui-today.js
           从上面那张复制结构、摘掉 id 后填进来。只给看，inert 让它点不到。 -->
      <div class="under" id="under" aria-hidden="true" inert hidden></div>
      <div class="paper" id="paper">
        <div class="note">
          <div class="tape"></div>
          <div class="polaroid">
            <div class="pic" id="dish-emoji">🍽️</div>
            <div class="cap" id="polaroid-cap"></div>
          </div>
          <div class="stickers" aria-hidden="true">
            <span class="sk1">✨</span>
            <span class="sk2">🔥</span>
            <span class="sk3">⭐️</span>
          </div>
          <p id="slot-label" class="slot-label"></p>
          <h1 id="dish-name" class="dish-name"></h1>
          <div class="meta-row">
            <p id="shop-name" class="shop-name"></p>
            <p id="price" class="price"></p>
          </div>
          <p id="reason" class="reason"></p>
          <!-- 必须是真实的 <a>，不能是 <button> + location.href：iOS 的 Universal
               Links 唤不起脚本发起的跳转。href 由 showAt() 逐张卡片写入。 -->
          <a id="order" class="primary">去下单</a>
          <div class="ghost-row">
            <button id="copy-shop" class="ghost" type="button">复制店名</button>
            <button id="mute" class="ghost" type="button">别再推这个</button>
          </div>
          <div class="swap-row">
            <button id="prev" class="swap" type="button"><i>←</i> 上一个</button>
            <span class="swipe-hint">划一划换一个</span>
            <button id="swap" class="swap" type="button">下一个 <i>→</i></button>
          </div>
          <p id="carousel-pos" class="carousel-pos"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="empty" class="card" hidden>
    <p class="empty-text">候选池里这一顿没有可推的。</p>
    <a class="primary" href="pool.html">去添加菜品</a>
  </section>

  <section id="failure" class="card" hidden>
    <p class="empty-text" id="failure-text"></p>
    <button id="retry" class="primary" type="button">重试</button>
  </section>

</main>

<!-- 底部两个标签：翻牌子（选餐，这一页）/ 御膳房（候选池）。普通链接整页跳转，
     不做单页路由 —— 两页各有各的脚本，没有共享状态要保。 -->
<nav class="tabbar" aria-label="页面">
  <a class="tab on" href="index.html" aria-current="page"><span class="tab-ico">🎴</span><span class="tab-name">翻牌子</span></a>
  <a class="tab" href="pool.html"><span class="tab-ico">🍱</span><span class="tab-name">御膳房</span></a>
</nav>

<div id="feedback" class="overlay" hidden></div>

<!-- 【临时】真机量高度用的角标，2026-09-23 加。TabBar 位置确认后整段删掉。
     数字单位都是 pt（CSS px）。「底」是元素底边到屏幕顶的距离。 -->
<div id="vp-debug" style="position:fixed;top:calc(env(safe-area-inset-top) + 2px);left:4px;z-index:999;
  pointer-events:none;font:10px/1.35 ui-monospace,Menlo,monospace;color:#fff;background:rgba(0,0,0,.65);
  padding:3px 5px;border-radius:4px;white-space:pre"></div>
<script>
(function () {
  var box = document.getElementById('vp-debug');
  function probe(css) {
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;top:0;left:-9999px;width:1px;visibility:hidden;' + css;
    document.body.appendChild(d);
    var r = d.getBoundingClientRect(), cs = getComputedStyle(d);
    var out = { h: Math.round(r.height), pt: parseFloat(cs.paddingTop), pb: parseFloat(cs.paddingBottom) };
    d.remove();
    return out;
  }
  function show(tag) {
    var sa = probe('height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)');
    var bar = document.querySelector('.tabbar').getBoundingClientRect();
    var html = document.documentElement.getBoundingClientRect();
    var sm = window.matchMedia('(display-mode: standalone)').matches;
    box.textContent =
      tag + (sm ? ' 主屏App' : ' 浏览器') + '\n' +
      '屏幕 ' + screen.height + '  inner ' + innerHeight + '  client ' + document.documentElement.clientHeight + '\n' +
      'vv ' + Math.round(visualViewport ? visualViewport.height : -1) +
      '  lvh ' + probe('height:100lvh').h + '  dvh ' + probe('height:100dvh').h + '  svh ' + probe('height:100svh').h + '\n' +
      '安全区 上' + sa.pt + ' 下' + sa.pb + '  html底 ' + Math.round(html.bottom) + '  bar底 ' + Math.round(bar.bottom) +
      '  bar定位 ' + getComputedStyle(document.querySelector('.tabbar')).position;
  }
  addEventListener('load', function () {
    show('载入');
    setTimeout(function () { show('1秒后'); }, 1000);
  });
  addEventListener('resize', function () { show('变化后'); });
})();
</script>

<script type="module" src="src/ui-today.js"></script>
</body>
</html>

<!DOCTYPE html>
<!-- app-today：这一页的整页布局（锁一屏、TabBar 贴底、高度补偿）挂在这个 class 上，
     不挂 data-slot —— 后者要等脚本算出饭点才写得上，在那之前 TabBar 会先落在
     错的位置再跳一下。data-slot 只管配色。 -->
<html lang="zh-CN" class="app-today">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>今天这顿</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
<script>
// 首屏之前就要量：iOS 主屏 App 在状态栏透明时（这一页为了让饭点颜色铺到状态栏
// 后面开着它）报给页面的可用高度会少一截状态栏的高度，底部那条页面够不着 ——
// TabBar 和补问面板都会被抬高。量出「屏幕高度 − 可用高度」写进 --vp-gap，
// style.css 里 html.app-today 那段把整页补下去。
//
// 写成 <head> 里的行内脚本而不是放进 ui-today.js：模块要等下载和解析，
// 那之前可能已经画了一帧，TabBar 会在错的位置闪一下。
// 这里不碰任何可调常数，所以不违反「常数只放 config.js」。
//
// 只有这一页量：候选池没开透明状态栏，它的可用高度本来就从状态栏下面算起，
// 补了反而会把 TabBar 推到屏幕外面。Safari 浏览器里也不补 —— 那里矮的是地址栏。
(function () {
  function fitViewport() {
    var gap = 0;
    if (navigator.standalone === true) {
      var portrait = window.innerHeight >= window.innerWidth;
      // iOS 的 screen.width/height 不随横竖屏交换，按当前朝向取对应那条边。
      var full = portrait
        ? Math.max(screen.width, screen.height)
        : Math.min(screen.width, screen.height);
      var diff = full - window.innerHeight;
      // 上限 80px 是保险：状态栏最高 59，量出更大的值说明假设不成立，宁可不补。
      if (diff > 0 && diff <= 80) gap = diff;
    }
    document.documentElement.style.setProperty('--vp-gap', gap + 'px');
  }
  // 量很多次，不是量一次。<head> 里这一次赶在首屏之前，但那会儿页面还没排版，
  // iOS 报的高度可能还是屏幕整高（差值 0，等于没补，TabBar 又偏高）——
  // 所以排版完、加载完、从后台回来、转屏时都要再量一遍，数变了就跟着改。
  // 值没变时 setProperty 写同样的值，不会触发重排。
  fitViewport();
  document.addEventListener('DOMContentLoaded', fitViewport);
  window.addEventListener('load', function () {
    fitViewport();
    // 加载完那一帧高度有时还在收敛，下一帧再确认一次。
    requestAnimationFrame(fitViewport);
  });
  window.addEventListener('pageshow', fitViewport);
  window.addEventListener('orientationchange', fitViewport);
  window.addEventListener('resize', fitViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitViewport);
  }

  // 页面切换的淡入淡出被打断时（比如还没播完又点了另一个标签），浏览器那条
  // Promise 没人接，控制台会报一条 AbortError。接住它，不然真机上排查别的
  // 问题时满屏都是这条。
  function hushTransition(e) {
    // 被跳过时拒绝的是 ready，不是 finished —— 两条都要接。
    if (!e.viewTransition) return;
    e.viewTransition.ready.catch(function () {});
    e.viewTransition.finished.catch(function () {});
  }
  window.addEventListener('pagereveal', hushTransition);
  window.addEventListener('pageswap', hushTransition);
})();
</script>
</head>
<body>
<main class="wrap">
  <section id="card" class="board" hidden>
    <div class="stack">
      <!-- 垫在底下的真卡片：内容是下一道（往右拖时换成上一道），由 ui-today.js
           从上面那张复制结构、摘掉 id 后填进来。只给看，inert 让它点不到。 -->
      <div class="under" id="under" aria-hidden="true" inert hidden></div>
      <div class="paper" id="paper">
        <div class="note">
          <div class="tape"></div>
          <div class="polaroid">
            <div class="pic" id="dish-emoji">🍽️</div>
            <div class="cap" id="polaroid-cap"></div>
          </div>
          <div class="stickers" aria-hidden="true">
            <span class="sk1">✨</span>
            <span class="sk2">🔥</span>
            <span class="sk3">⭐️</span>
          </div>
          <p id="slot-label" class="slot-label"></p>
          <h1 id="dish-name" class="dish-name"></h1>
          <div class="meta-row">
            <p id="shop-name" class="shop-name"></p>
            <p id="price" class="price"></p>
          </div>
          <p id="reason" class="reason"></p>
          <!-- 必须是真实的 <a>，不能是 <button> + location.href：iOS 的 Universal
               Links 唤不起脚本发起的跳转。href 由 showAt() 逐张卡片写入。 -->
          <a id="order" class="primary">去下单</a>
          <div class="ghost-row">
            <button id="copy-shop" class="ghost" type="button">复制店名</button>
            <button id="mute" class="ghost" type="button">别再推这个</button>
          </div>
          <div class="swap-row">
            <button id="prev" class="swap" type="button"><i>←</i> 上一个</button>
            <span class="swipe-hint">划一划换一个</span>
            <button id="swap" class="swap" type="button">下一个 <i>→</i></button>
          </div>
          <p id="carousel-pos" class="carousel-pos"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="empty" class="card" hidden>
    <p class="empty-text">候选池里这一顿没有可推的。</p>
    <a class="primary" href="pool.html">去添加菜品</a>
  </section>

  <section id="failure" class="card" hidden>
    <p class="empty-text" id="failure-text"></p>
    <button id="retry" class="primary" type="button">重试</button>
  </section>

</main>

<!-- 底部两个标签：翻牌子（选餐，这一页）/ 御膳房（候选池）。普通链接整页跳转，
     不做单页路由 —— 两页各有各的脚本，没有共享状态要保。 -->
<nav class="tabbar" aria-label="页面">
  <a class="tab on" href="index.html" aria-current="page"><span class="tab-ico">🎴</span><span class="tab-name">翻牌子</span></a>
  <a class="tab" href="pool.html"><span class="tab-ico">🍱</span><span class="tab-name">御膳房</span></a>
</nav>

<div id="feedback" class="overlay" hidden></div>

<script type="module" src="src/ui-today.js"></script>
</body>
</html>

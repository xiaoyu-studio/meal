<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>御膳房</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
<script>
// 同 index.html 末尾那两行：页面切换的淡入淡出被打断时接住那条 Promise，
// 否则控制台会多一条 AbortError。
function hushTransition(e) {
  // 被跳过时拒绝的是 ready，不是 finished —— 两条都要接。
  if (!e.viewTransition) return;
  e.viewTransition.ready.catch(function () {});
  e.viewTransition.finished.catch(function () {});
}
window.addEventListener('pagereveal', hushTransition);
window.addEventListener('pageswap', hushTransition);
</script>
</head>
<body>
<main class="wrap has-tabbar">
  <h1 class="page-title">御膳房 <span class="page-sub">候选池</span></h1>

  <div id="io-row" class="io-row">
    <button id="export" class="ghost" type="button">导出备份</button>
    <label class="ghost import-label">
      导入备份
      <input id="import" type="file" accept="application/json" hidden>
    </label>
  </div>
  <p id="io-msg" class="io-msg"></p>

  <form id="shop-form" class="form">
    <h2 class="form-title">加一家店</h2>
    <input name="name" placeholder="店名" required>
    <select name="platform">
      <option value="meituan">美团外卖</option>
      <option value="eleme">淘宝闪购（原饿了么）</option>
    </select>
    <input name="link" type="url" placeholder="从外卖 App 分享出来的链接" required>
    <select name="hygiene">
      <option value="unknown">卫生：未知</option>
      <option value="trusted">卫生：放心</option>
      <option value="blocked">卫生：拉黑</option>
    </select>
    <p id="shop-msg" class="io-msg"></p>
    <button class="primary" type="submit">保存店铺</button>
  </form>

  <section id="failure" class="card" hidden>
    <p class="empty-text" id="failure-text"></p>
    <button id="retry" class="primary" type="button">重试</button>
  </section>

  <div id="shops"></div>
</main>

<nav class="tabbar" aria-label="页面">
  <a class="tab" href="index.html"><span class="tab-ico">🎴</span><span class="tab-name">翻牌子</span></a>
  <a class="tab on" href="pool.html" aria-current="page"><span class="tab-ico">🍱</span><span class="tab-name">御膳房</span></a>
</nav>

<div id="toast" class="toast" hidden></div>

<script type="module" src="src/ui-pool.js"></script>
</body>
</html>
